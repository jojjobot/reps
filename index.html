<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reps">
<title>Reps</title>
<style>
  :root {
    --bg: #0f0f1e;
    --card: #1a1a2e;
    --card2: #232342;
    --line: #2e2e52;
    --text: #f1f1f8;
    --dim: #8c8cab;
    --accent: #00e5ff;
    --hot: #e94560;
    --good: #39ff88;
    --gold: #ffd166;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    max-width: 520px; margin: 0 auto;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: 0.04em; }
  h1 span { color: var(--accent); }
  .date { color: var(--dim); font-size: 14px; }
  .streak {
    display: flex; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 14px; margin-bottom: 14px;
  }
  .streak b { font-size: 26px; color: var(--gold); font-variant-numeric: tabular-nums; }
  .streak small { color: var(--dim); display: block; }

  .tabs { position: relative; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 999px; padding: 9px 16px; font: inherit; font-size: 15px; cursor: pointer;
  }
  .tab.on { background: var(--accent); color: #001018; border-color: var(--accent); font-weight: 700; }
  .newex { display: flex; gap: 8px; margin-bottom: 12px; }
  .newex input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--text); background: var(--card);
    border: 1px dashed var(--line); border-radius: 12px; padding: 11px 14px;
  }
  .newex input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .newex button {
    border: 0; border-radius: 12px; padding: 0 18px; font: inherit; font-weight: 800;
    background: var(--card2); color: var(--accent); cursor: pointer;
  }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 14px; }
  .label { color: var(--dim); font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; }
  .today-total { font-size: 64px; font-weight: 800; line-height: 1; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
  .today-total small { font-size: 18px; color: var(--dim); font-weight: 600; margin-left: 6px; }
  .hint { color: var(--dim); font-size: 14px; min-height: 20px; }
  .hint.win { color: var(--good); }

  .entry { display: flex; gap: 8px; margin-top: 14px; }
  .step {
    width: 52px; flex: none; border: 1px solid var(--line); background: var(--card2); color: var(--text);
    border-radius: 12px; font-size: 26px; cursor: pointer;
  }
  .entry input {
    flex: 1; min-width: 0; text-align: center; font: inherit; font-size: 26px; font-weight: 700;
    background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 10px 0;
  }
  .entry input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .save {
    width: 100%; margin-top: 10px; border: 0; border-radius: 14px; padding: 16px; font: inherit; font-size: 18px;
    font-weight: 800; letter-spacing: 0.04em; background: var(--accent); color: #001018; cursor: pointer;
  }
  .save:active, .step:active { transform: scale(0.97); }
  .sets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .set {
    background: var(--card2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px;
    font-size: 14px; color: var(--text); cursor: pointer; font-variant-numeric: tabular-nums;
  }
  .set::after { content: " ×"; color: var(--dim); }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--dim); font-size: 12px; }
  .stat.best b { color: var(--gold); }

  .chart-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .range { display: flex; gap: 4px; }
  .range button {
    border: 1px solid var(--line); background: transparent; color: var(--dim); border-radius: 8px;
    padding: 4px 9px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .range button.on { color: var(--text); border-color: var(--accent); }
  canvas { width: 100%; height: 190px; display: block; }
  #chart, #when { cursor: zoom-in; }
  .expand { color: var(--dim); font-size: 12px; margin-top: 6px; }

  .big {
    position: fixed; inset: 0; z-index: 10; background: var(--bg); display: none; flex-direction: column;
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .big.show { display: flex; }
  .big-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .big-close {
    width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
    color: var(--text); font-size: 20px; cursor: pointer;
  }
  .big .range { align-items: center; margin-bottom: 10px; }
  .big canvas { flex: 1; height: auto; min-height: 0; }
  .legend { display: flex; gap: 14px; color: var(--dim); font-size: 12px; margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  .history { list-style: none; margin: 0; padding: 0; }
  .history li { display: flex; flex-wrap: wrap; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .history .times { flex-basis: 100%; color: var(--dim); font-size: 12px; margin-top: 2px; }
  .set em { font-style: normal; color: var(--dim); }
  .history li:last-child { border: 0; }
  .history .d { color: var(--dim); }
  .history .pb { color: var(--gold); font-size: 12px; margin-left: 6px; }
  .empty { color: var(--dim); text-align: center; padding: 10px 0; }

  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .tools button {
    flex: 1; border: 1px solid var(--line); background: var(--card2); color: var(--text); border-radius: 12px;
    padding: 11px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .tools button.danger { color: var(--hot); }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 30px);
    background: var(--good); color: #002010; font-weight: 800; padding: 12px 20px; border-radius: 999px;
    opacity: 0; transition: 0.25s; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<header>
  <h1>RE<span>PS</span></h1>
  <div class="date" id="date"></div>
</header>

<div class="streak">
  <div style="font-size:28px">🔥</div>
  <div><b id="streak">0</b> <small id="streakText">days in a row</small></div>
</div>

<form class="newex" id="newEx" autocomplete="off">
  <input id="exName" type="text" maxlength="24" placeholder="Add your own exercise…" enterkeyhint="done" aria-label="New exercise name">
  <button type="submit">Add</button>
</form>

<nav class="tabs" id="tabs"></nav>

<section class="card">
  <div class="label">Today · <span id="exLabel" style="color:var(--accent)"></span></div>
  <div class="today-total" id="todayTotal">0</div>
  <div class="hint" id="hint"></div>
  <div class="entry">
    <button class="step" id="minus" aria-label="Less">−</button>
    <input id="amount" type="number" inputmode="numeric" min="1" value="10" aria-label="Amount">
    <button class="step" id="plus" aria-label="More">+</button>
  </div>
  <button class="save" id="save">ADD</button>
  <div class="sets" id="sets"></div>
</section>

<div class="stats">
  <div class="stat best"><b id="best">0</b><span>best day</span></div>
  <div class="stat"><b id="week">0</b><span>last 7 days</span></div>
  <div class="stat"><b id="total">0</b><span>all time</span></div>
</div>

<section class="card">
  <div class="chart-head">
    <div class="label">Progress</div>
    <div class="range" id="range">
      <button data-days="7">7d</button>
      <button data-days="30" class="on">30d</button>
      <button data-days="90">90d</button>
    </div>
  </div>
  <canvas id="chart"></canvas>
  <div class="legend">
    <span><i style="background:var(--accent)"></i>per day</span>
    <span><i style="background:var(--gold)"></i>best</span>
    <span><i style="background:var(--good)"></i>7-day average</span>
  </div>
  <div class="expand">⤢ Tap the graph to see it full screen</div>
</section>

<section class="card">
  <div class="label" style="margin-bottom:8px">Every set, when you did it</div>
  <canvas id="when"></canvas>
  <div class="legend">
    <span><i style="background:#ffb347"></i>morning</span>
    <span><i style="background:var(--accent)"></i>afternoon</span>
    <span><i style="background:#b388ff"></i>evening</span>
  </div>
  <div class="expand">⤢ Tap the graph to see it full screen, then tap a dot to see that set</div>
</section>

<section class="card">
  <div class="label" style="margin-bottom:6px">History</div>
  <ul class="history" id="history"></ul>
</section>

<section class="card">
  <div class="label" style="margin-bottom:10px">Your data</div>
  <div class="tools">
    <button id="export">Save backup</button>
    <button id="import">Load backup</button>
    <button id="remove" class="danger">Remove exercise</button>
  </div>
  <input type="file" id="file" accept="application/json" hidden>
</section>

<div class="big" id="big">
  <div class="big-head">
    <div class="label" id="bigTitle"></div>
    <button class="big-close" id="bigClose" aria-label="Close">✕</button>
  </div>
  <div class="range" id="bigRange">
    <button data-days="7">7d</button>
    <button data-days="30">30d</button>
    <button data-days="90">90d</button>
    <span class="hint" id="bigHint" style="margin-left:8px"></span>
  </div>
  <canvas id="bigCanvas"></canvas>
</div>

<div class="toast" id="toast"></div>

<script>
// Everything is stored on this phone (localStorage). "Save backup" downloads it as a file.
const KEY = 'reps-tracker-v1'
const DEFAULT = {
  exercises: [
    { id: 'pushups', name: 'Push-ups', unit: 'reps', step: 5 },
    { id: 'situps', name: 'Sit-ups', unit: 'reps', step: 5 },
    { id: 'squats', name: 'Squats', unit: 'reps', step: 5 },
    { id: 'pullups', name: 'Pull-ups', unit: 'reps', step: 1 },
    { id: 'plank', name: 'Plank', unit: 'sec', step: 10 },
  ],
  log: {},        // { 'YYYY-MM-DD': { exerciseId: [{ n: amount, t: ms timestamp }, ...] } } (a bare number = an old set with no time)
  current: 'pushups',
}

let data = load()
let days = 30

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(KEY))
    if (saved && Array.isArray(saved.exercises) && saved.log) return saved
  } catch {}
  return structuredClone(DEFAULT)
}
function store() {
  try { localStorage.setItem(KEY, JSON.stringify(data)) } catch {}
}
// Another tab saved: take its data, or this tab's next save would wipe out what it added.
addEventListener('storage', e => { if (e.key === KEY) { data = load(); render() } })
// Ask the browser not to clear this site's storage when the phone runs low on space.
try { navigator.storage?.persist?.() } catch {}

const $ = id => document.getElementById(id)
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`
const today = () => dayKey(new Date())
const shift = (key, n) => { const d = new Date(key + 'T12:00:00'); d.setDate(d.getDate() + n); return dayKey(d) }
const current = () => data.exercises.find(e => e.id === data.current) || data.exercises[0]
const setsOn = (key, id) => (data.log[key]?.[id] || []).map(s => typeof s === 'number' ? { n: s, t: null } : s)
const totalOn = (key, id) => setsOn(key, id).reduce((a, s) => a + s.n, 0)
const fmt = n => n.toLocaleString()
const clock = t => new Date(t).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })

function streak() {
  // Days in a row with ANY exercise logged, ending today (or yesterday, so it doesn't break before you train).
  const any = k => data.log[k] && Object.values(data.log[k]).some(a => a.length)
  let k = any(today()) ? today() : shift(today(), -1)
  let n = 0
  while (any(k)) { n++; k = shift(k, -1) }
  return n
}

function render() {
  const ex = current()
  const t = today()
  $('date').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'short' })

  const s = streak()
  $('streak').textContent = s
  $('streakText').textContent = s === 1 ? 'day in a row' : 'days in a row'

  $('tabs').innerHTML = data.exercises.map(e =>
    `<button class="tab ${e.id === ex.id ? 'on' : ''}" data-id="${e.id}">${escape(e.name)}</button>`).join('')
  const now = totalOn(t, ex.id)
  $('todayTotal').innerHTML = `${fmt(now)}<small>${ex.unit}</small>`
  $('exLabel').textContent = ex.name
  // Keep the open tab in sight (a new one lands at the far right).
  const on = $('tabs').querySelector('.tab.on')
  if (on) $('tabs').scrollLeft = on.offsetLeft - ($('tabs').clientWidth - on.offsetWidth) / 2

  // Every day ever logged for this exercise.
  const daysLogged = Object.keys(data.log).filter(k => totalOn(k, ex.id) > 0).sort()
  const before = daysLogged.filter(k => k < t)
  const prevBest = Math.max(0, ...before.map(k => totalOn(k, ex.id)))
  const last = before.length ? totalOn(before[before.length - 1], ex.id) : 0
  const hint = $('hint')
  hint.classList.remove('win')
  if (!before.length && !now) hint.textContent = 'Log your first set to start tracking.'
  else if (prevBest && now > prevBest) { hint.textContent = `New record! ${fmt(now - prevBest)} more than your old best.`; hint.classList.add('win') }
  else if (last && now >= last) { hint.textContent = `Beat last time (${fmt(last)}). Keep going!`; hint.classList.add('win') }
  else if (last) hint.textContent = `${fmt(last - now)} more to beat last time (${fmt(last)}).`
  else hint.textContent = ''

  $('sets').innerHTML = setsOn(t, ex.id).map((s, i) =>
    `<span class="set" data-i="${i}" title="Remove">${s.t ? `<em>${clock(s.t)}</em> ` : ''}${fmt(s.n)}</span>`).join('')

  const allTotals = daysLogged.map(k => totalOn(k, ex.id))
  $('best').textContent = fmt(Math.max(0, ...allTotals))
  let week = 0
  for (let i = 0; i < 7; i++) week += totalOn(shift(t, -i), ex.id)
  $('week').textContent = fmt(week)
  $('total').textContent = fmt(allTotals.reduce((a, b) => a + b, 0))

  // History: newest first, personal bests marked.
  let runningBest = 0
  const pb = new Set()
  for (const k of daysLogged) { const v = totalOn(k, ex.id); if (v > runningBest) { runningBest = v; pb.add(k) } }
  $('history').innerHTML = daysLogged.length
    ? daysLogged.slice().reverse().slice(0, 30).map(k =>
        `<li><span class="d">${new Date(k + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' })}</span>` +
        `<span>${fmt(totalOn(k, ex.id))} ${ex.unit}${pb.has(k) ? '<span class="pb">★ record</span>' : ''}</span>` +
        `<small class="times">${setsOn(k, ex.id).map(s => (s.t ? clock(s.t) + ' · ' : '') + fmt(s.n)).join('&nbsp;&nbsp;')}</small></li>`).join('')
    : '<li class="empty">Nothing yet</li>'

  document.querySelectorAll('#range button').forEach(b => b.classList.toggle('on', +b.dataset.days === days))
  drawChart(ex)
  drawWhen(ex)
}

function drawChart(ex, c = $('chart')) {
  const dpr = window.devicePixelRatio || 1
  const w = c.clientWidth, h = c.clientHeight
  c.width = w * dpr; c.height = h * dpr
  const g = c.getContext('2d')
  g.scale(dpr, dpr)
  g.clearRect(0, 0, w, h)

  const t = today()
  const keys = Array.from({ length: days }, (_, i) => shift(t, i - days + 1))
  const vals = keys.map(k => totalOn(k, ex.id))
  const best = Math.max(...vals)
  const top = Math.max(10, best) * 1.15
  const padL = 30, padB = 18, padT = 6
  const cw = w - padL, ch = h - padB - padT
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim()

  // Grid + axis labels
  g.font = '11px system-ui, sans-serif'
  g.fillStyle = css('--dim'); g.strokeStyle = css('--line'); g.lineWidth = 1
  for (let i = 0; i <= 3; i++) {
    const v = Math.round(top * i / 3), y = padT + ch - ch * i / 3
    g.beginPath(); g.moveTo(padL, y + 0.5); g.lineTo(w, y + 0.5); g.stroke()
    g.textAlign = 'right'; g.fillText(v, padL - 5, y + 4)
  }

  // Bars
  const slot = cw / days, bw = Math.max(2, slot * 0.7)
  vals.forEach((v, i) => {
    if (!v) return
    const bh = ch * v / top
    g.fillStyle = v === best ? css('--gold') : css('--accent')
    const x = padL + i * slot + (slot - bw) / 2
    g.beginPath()
    g.roundRect ? g.roundRect(x, padT + ch - bh, bw, bh, Math.min(4, bw / 2)) : g.rect(x, padT + ch - bh, bw, bh)
    g.fill()
  })

  // 7-day average line (only over days you could have trained)
  g.strokeStyle = css('--good'); g.lineWidth = 2; g.beginPath()
  let started = false
  keys.forEach((k, i) => {
    let sum = 0
    for (let j = 0; j < 7; j++) sum += totalOn(shift(k, -j), ex.id)
    const avg = sum / 7
    const x = padL + i * slot + slot / 2, y = padT + ch - ch * avg / top
    if (!started) { g.moveTo(x, y); started = true } else g.lineTo(x, y)
  })
  g.stroke()

  // First / last date labels
  g.fillStyle = css('--dim')
  const short = k => new Date(k + 'T12:00:00').toLocaleDateString(undefined, { day: 'numeric', month: 'short' })
  g.textAlign = 'left'; g.fillText(short(keys[0]), padL, h - 4)
  g.textAlign = 'right'; g.fillText('today', w, h - 4)
}

// The timeline: x = the real date and time, y = reps in that set. Dots are kept on the canvas for tapping.
const partOfDay = t => { const h = new Date(t).getHours(); return h < 12 ? '#ffb347' : h < 18 ? null : '#b388ff' }

function drawWhen(ex, c = $('when')) {
  const dpr = window.devicePixelRatio || 1
  const w = c.clientWidth, h = c.clientHeight
  c.width = w * dpr; c.height = h * dpr
  const g = c.getContext('2d')
  g.scale(dpr, dpr)
  g.clearRect(0, 0, w, h)
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim()

  const startKey = shift(today(), -days + 1)
  const from = new Date(startKey + 'T00:00:00').getTime()
  const to = new Date(shift(today(), 1) + 'T00:00:00').getTime()
  const sets = []
  for (let k = startKey; k <= today(); k = shift(k, 1)) for (const s of setsOn(k, ex.id)) if (s.t) sets.push(s)
  const top = Math.max(10, ...sets.map(s => s.n)) * 1.15
  const padL = 30, padB = 18, padT = 6
  const cw = w - padL - 4, ch = h - padB - padT
  const X = t => padL + cw * (t - from) / (to - from)
  const Y = n => padT + ch - ch * n / top

  g.font = '11px system-ui, sans-serif'
  g.strokeStyle = css('--line'); g.fillStyle = css('--dim'); g.lineWidth = 1
  for (let i = 0; i <= 3; i++) {
    const v = Math.round(top * i / 3), y = Y(top * i / 3)
    g.beginPath(); g.moveTo(padL, y + 0.5); g.lineTo(w, y + 0.5); g.stroke()
    g.textAlign = 'right'; g.fillText(v, padL - 5, y + 4)
  }
  // A faint line at each midnight (each Monday on the long ranges), labelled underneath.
  const every = days <= 7 ? 1 : 7
  g.textAlign = 'center'
  for (let k = startKey; k <= today(); k = shift(k, 1)) {
    const d = new Date(k + 'T00:00:00')
    if (every === 7 && d.getDay() !== 1) continue
    const x = X(d.getTime())
    g.strokeStyle = css('--line'); g.beginPath(); g.moveTo(x + 0.5, padT); g.lineTo(x + 0.5, padT + ch); g.stroke()
    const label = days <= 7 ? d.toLocaleDateString(undefined, { weekday: 'short' }) : d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' })
    if (x > padL + 12 && x < w - 12) g.fillText(label, x, h - 4)
  }

  c.dots = sets.map(s => ({ x: X(s.t), y: Y(s.n), s }))
  for (const d of c.dots) {
    const col = partOfDay(d.s.t) || css('--accent')
    g.strokeStyle = col; g.globalAlpha = 0.45; g.lineWidth = 2
    g.beginPath(); g.moveTo(d.x, Y(0)); g.lineTo(d.x, d.y); g.stroke()
    g.globalAlpha = 1; g.fillStyle = col
    g.beginPath(); g.arc(d.x, d.y, days > 30 ? 3 : 4.5, 0, Math.PI * 2); g.fill()
  }
  if (!sets.length) {
    g.fillStyle = css('--dim'); g.textAlign = 'center'
    g.fillText('Your sets will appear here as you log them', padL + cw / 2, padT + ch / 2)
  }
}

// --- Full screen: tap a graph and it fills the screen (turn the phone sideways for more room) ---
let big = null   // 'chart' | 'when' | null
const BIG_TITLE = { chart: 'Progress', when: 'Every set, when you did it' }

function drawBig() {
  if (!big) return
  const c = $('bigCanvas')
  if (big === 'chart') drawChart(current(), c)
  else drawWhen(current(), c)
  document.querySelectorAll('#bigRange button').forEach(b => b.classList.toggle('on', +b.dataset.days === days))
}
function openBig(which) {
  big = which
  $('bigTitle').textContent = `${current().name} · ${BIG_TITLE[which]}`
  $('bigHint').textContent = which === 'when' ? 'Tap a dot to see that set' : ''
  $('big').classList.add('show')
  document.body.style.overflow = 'hidden'
  try { $('big').requestFullscreen?.().then(() => screen.orientation?.lock?.('landscape')).catch(() => {}) } catch {}
  requestAnimationFrame(drawBig)
}
function closeBig() {
  big = null
  $('big').classList.remove('show')
  document.body.style.overflow = ''
  try { if (document.fullscreenElement) document.exitFullscreen() } catch {}
}
$('chart').addEventListener('click', () => openBig('chart'))
$('when').addEventListener('click', () => openBig('when'))
$('bigClose').onclick = closeBig
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && big) requestAnimationFrame(drawBig) })
$('bigRange').addEventListener('click', e => {
  const b = e.target.closest('button')
  if (b) { days = +b.dataset.days; render(); drawBig() }
})
$('bigCanvas').addEventListener('click', e => {
  const c = $('bigCanvas')
  if (big !== 'when' || !c.dots) return
  const r = c.getBoundingClientRect()
  const x = e.clientX - r.left, y = e.clientY - r.top
  let best = null, dist = 30
  for (const d of c.dots) { const dd = Math.hypot(d.x - x, d.y - y); if (dd < dist) { dist = dd; best = d } }
  if (best) {
    const when = new Date(best.s.t).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' })
    toast(`${when}, ${clock(best.s.t)} · ${fmt(best.s.n)} ${current().unit}`)
  }
})

function escape(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])) }

function toast(msg) {
  const el = $('toast')
  el.textContent = msg
  el.classList.add('show')
  clearTimeout(toast.t)
  toast.t = setTimeout(() => el.classList.remove('show'), 1600)
}

// --- Events ---
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button')
  if (!b) return
  data.current = b.dataset.id
  $('amount').value = current().step * 2
  store(); render()
})

// Type a name at the top, press Add (or Enter): it becomes a tab and is opened.
// Counted in seconds when the name sounds timed (plank, hold, hang...), otherwise reps.
$('newEx').addEventListener('submit', e => {
  e.preventDefault()
  const name = $('exName').value.trim().slice(0, 24)
  if (!name) { $('exName').focus(); return }
  const same = data.exercises.find(x => x.name.toLowerCase() === name.toLowerCase())
  if (same) {
    data.current = same.id
    toast(`${same.name} is already there`)
  } else {
    const timed = /plank|hold|hang|wall ?sit|stretch|sec|minute|run|jog|walk/i.test(name)
    const id = 'ex' + Date.now()
    data.exercises.push({ id, name, unit: timed ? 'sec' : 'reps', step: timed ? 10 : 5 })
    data.current = id
    toast(`${name} added`)
  }
  $('exName').value = ''
  $('exName').blur()
  $('amount').value = current().step * 2
  store(); render()
})

$('minus').onclick = () => { $('amount').value = Math.max(1, (+$('amount').value || 0) - current().step) }
$('plus').onclick = () => { $('amount').value = (+$('amount').value || 0) + current().step }

$('save').onclick = () => {
  const n = Math.round(+$('amount').value)
  if (!(n > 0)) { toast('Enter a number first'); return }
  const t = today(), ex = current()
  data.log[t] ??= {}
  data.log[t][ex.id] ??= []
  data.log[t][ex.id].push({ n, t: Date.now() })
  store(); render()
  toast(`+${fmt(n)} ${ex.unit} · today ${fmt(totalOn(t, ex.id))}`)
  if (navigator.vibrate) navigator.vibrate(30)
}

$('sets').addEventListener('click', e => {
  const s = e.target.closest('.set')
  if (!s) return
  const list = data.log[today()][current().id]
  if (!confirm(`Remove this set of ${setsOn(today(), current().id)[+s.dataset.i].n}?`)) return
  list.splice(+s.dataset.i, 1)
  store(); render()
})

$('range').addEventListener('click', e => {
  const b = e.target.closest('button')
  if (b) { days = +b.dataset.days; render() }
})

$('export').onclick = () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = `reps-backup-${today()}.json`
  a.click()
  URL.revokeObjectURL(a.href)
}
$('import').onclick = () => $('file').click()
$('file').onchange = async () => {
  const f = $('file').files[0]
  if (!f) return
  try {
    const d = JSON.parse(await f.text())
    if (!Array.isArray(d.exercises) || !d.log) throw 0
    if (!confirm('Replace everything on this phone with the backup?')) return
    data = d; store(); render(); toast('Backup loaded')
  } catch { toast('That file is not a Reps backup') }
  $('file').value = ''
}
$('remove').onclick = () => {
  const ex = current()
  if (data.exercises.length === 1) { toast('Keep at least one exercise'); return }
  if (!confirm(`Remove "${ex.name}" and all its history?`)) return
  data.exercises = data.exercises.filter(e => e.id !== ex.id)
  for (const k in data.log) delete data.log[k][ex.id]
  data.current = data.exercises[0].id
  store(); render()
}

addEventListener('resize', () => { drawChart(current()); drawWhen(current()); drawBig() })
// Midnight rollover while the app stays open.
document.addEventListener('visibilitychange', () => { if (!document.hidden) { data = load(); render() } })

$('amount').value = current().step * 2
render()
</script>
</body>
</html>
